<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podcasts 3000</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>Podcasts 3000</h1><button id="refresh-all">Refresh all</button></header>
  <main>
    <aside><form id="subscribe"><input id="feed-url" type="url" required placeholder="RSS or Atom feed URL"><button>Subscribe</button></form><section id="podcasts"></section></aside>
    <section class="content"><div id="episodes"><p class="muted">Subscribe to a feed to get started.</p></div><div class="player"><strong id="now-playing">Nothing playing</strong><audio id="audio" controls preload="metadata"></audio></div></section>
  </main>
  <dialog id="settings"><form method="dialog"><h2>Settings</h2><label>Podcast User-Agent<input id="custom-ua" type="text"></label><button value="cancel">Cancel</button><button id="save-settings" value="default">Save</button></form></dialog>
  <script src="/static/app.js"></script>
</body>
</html>
