<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podcasts 3000</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><h1>Podcasts 3000</h1><div class="toolbar"><button id="refresh-all">Refresh all</button><button id="purge-all">Purge all downloads</button></div></header>
  <main>
    <aside>
      <form id="subscribe"><input id="feed-url" type="url" required placeholder="RSS or Atom feed URL"><button>Subscribe</button></form>
      <form id="itunes-search"><input id="search-query" required placeholder="Search iTunes podcasts"><button>Search</button></form>
      <section id="search-view" hidden>
        <div class="subview-heading"><strong>Search results</strong><button id="close-search" class="icon-button" type="button" aria-label="Close search">✕ Close Search</button></div>
        <section id="search-results"></section>
      </section>
      <section id="podcasts"></section>
      <details><summary>OPML</summary><div class="button-row"><button id="import-opml" type="button">Import subscriptions</button><button id="export-opml" type="button">Export subscriptions</button></div></details>
    </aside>
    <section class="content"><div id="active-podcast"></div><div id="episodes"><p class="muted">Subscribe to a feed to get started.</p></div></section>
  </main>
  <footer class="player"><strong id="now-playing">Nothing playing</strong><audio id="audio" controls preload="metadata"></audio></footer>
  <dialog id="settings"><form method="dialog"><h2>Settings</h2><label>Podcast User-Agent<input id="custom-ua" type="text"></label><button value="cancel">Cancel</button><button id="save-settings" value="default">Save</button></form></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
